<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sylvia Core</title>
<script>
(function(){
  function load(src,ok,err){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s);}
  var xu=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
  var cu=['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js','https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js'];
  function tryX(i){if(i>=xu.length)return;load(xu[i],function(){tryC(0);},function(){tryX(i+1);});}
  function tryC(i){if(i>=cu.length)return;load(cu[i],function(){console.log('ready');},function(){tryC(i+1);});}
  tryX(0);
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#0f1117;--surface:#181c27;--surface2:#1e2333;
  --border:rgba(255,255,255,0.07);
  --accent:#4f9eff;--accent2:#36d9a0;--accent3:#f5a623;
  --danger:#ff5f57;--purple:#d97bff;
  --text:#e8eaf0;--text2:#8892a4;--text3:#4d5568;
  --radius:12px;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#ffb3c6,#ffaa70);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.logo-text{font-size:15px;font-weight:500}
.logo-sub{font-size:11px;color:var(--text2);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:10px}
#fileInfo{font-size:11px;color:var(--text2);font-family:var(--mono)}

/* Toast */
#toast{display:none;position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#36d9a0;color:#0f1117;padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.3)}

/* Upload */
#uploadSection{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:40px}
.drop-zone{width:100%;max-width:500px;border:2px dashed var(--border);border-radius:20px;padding:56px 40px;text-align:center;cursor:pointer;transition:all .25s;background:var(--surface)}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:rgba(79,158,255,.05);transform:translateY(-2px)}
.drop-icon{font-size:40px;margin-bottom:16px}
.drop-title{font-size:18px;font-weight:500;margin-bottom:8px}
.drop-sub{font-size:13px;color:var(--text2);line-height:1.6}
.drop-btn{display:inline-block;margin-top:22px;padding:10px 24px;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.drop-hint{margin-top:14px;font-size:11px;color:var(--text3);font-family:var(--mono)}
.data-status{margin-top:20px;padding:14px 20px;background:rgba(54,217,160,.08);border:1px solid rgba(54,217,160,.2);border-radius:10px;font-size:12px;color:var(--accent2);max-width:500px;width:100%;line-height:1.8}

/* SavedBar */
#savedBar{display:none;padding:9px 28px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);align-items:center;gap:8px;flex-wrap:wrap}
.m-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.m-del{cursor:pointer;color:var(--text3);margin-left:2px}
.m-del:hover{color:var(--danger)}
.btn-clear{margin-left:auto;padding:3px 9px;border-radius:5px;border:1px solid rgba(255,95,87,.3);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:var(--sans)}

/* Dashboard */
#dashboard{display:none;padding:22px 28px 40px}

/* View bar */
.view-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.view-title{font-size:16px;font-weight:600;margin-right:auto;letter-spacing:-.01em}
.view-title span{color:var(--accent)}
.toggle-grp{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.t-btn{padding:6px 16px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--sans);transition:all .15s}
.t-btn.on{background:var(--accent);color:#fff}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.kpi-lbl{font-size:10.5px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.kpi-val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:5px}
.kpi-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:4px;margin-top:4px}
.b-up{background:rgba(54,217,160,.15);color:var(--accent2)}
.b-dn{background:rgba(255,95,87,.15);color:var(--danger)}

/* Charts */
.chart-row{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:20px}
.chart-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:500}
.card-sub{font-size:11px;color:var(--text2)}
.leg-row{display:flex;gap:12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:2px}
.chart-wrap{position:relative}

/* Table */
.tbl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tbl-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-title{font-size:13px;font-weight:500;margin-right:auto}
.srch{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;width:170px}
.srch:focus{border-color:var(--accent)}
.srch::placeholder{color:var(--text3)}
select.ctrl{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:10px 13px;text-align:left;font-size:10.5px;font-weight:500;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface)}
thead th.r{text-align:right}
tbody td{padding:9px 13px;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
tbody td.r{text-align:right;font-family:var(--mono);font-size:12px}
tbody td.dim{color:var(--text2);font-family:var(--mono);font-size:11px}
tbody tr:hover td{background:rgba(255,255,255,.03)}
tbody tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500;font-family:var(--mono)}
.p-up{background:rgba(180,230,180,.25);color:#5ab87a}
.p-dn{background:rgba(255,180,180,.25);color:#ff8a8a}
.p-new{background:rgba(255,179,198,.25);color:#ffb3c6}
.p-na{background:rgba(255,200,150,.25);color:#ffaa70}
.tbl-foot{padding:9px 18px;font-size:11px;color:var(--text3);text-align:right;border-top:1px solid var(--border);font-family:var(--mono)}

.btn-hdr{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .2s}
.btn-hdr:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.chart-row,.chart-row2{grid-template-columns:1fr}#dashboard{padding:14px}header{padding:12px 14px}}
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <div class="logo">
    <div class="logo-mark">識</div>
    <div><div class="logo-text">Sylvia Finance</div><div class="logo-sub">Finance Hub</div></div>
  </div>
  <div class="hdr-right">
    <span id="fileInfo">2026年：尚未載入</span>
    <button class="btn-hdr" onclick="document.getElementById('fi2').click()">➕ 新增月份</button>
    <input type="file" id="fi2" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
  </div>
</header>

<div id="savedBar">
  <span>2026已儲存：</span>
  <div id="mTags"></div>
  <button class="btn-clear" onclick="clearAll()">🗑 清除2026資料</button>
</div>

<div id="uploadSection">
  <div class="drop-zone" id="dz">
    <div class="drop-icon">📊</div>
    <div class="drop-title">拖曳 2026 年 Excel 到這裡</div>
    <div class="drop-sub">每月上傳自動疊加，不覆蓋舊資料<br>2024、2025 全年資料已內建</div>
    <label class="drop-btn" for="fi">選擇檔案</label>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
    <div class="drop-hint">支援格式：.xlsx / .xls</div>
  </div>
  <div class="data-status">
    ✅ 2024 全年內建（1-12月）<br>
    ✅ 2025 全年內建（1-12月）<br>
    ⬆ 請上傳 2026 年 Excel，系統自動計算 YoY & MoM
  </div>
</div>

<div id="dashboard">
  <div class="view-bar">
    <div class="view-title" id="vTitle">應收帳款分析</div>
    <div class="toggle-grp">
      <button class="t-btn on" id="btn26" onclick="setView('2026')">2026年</button>
      <button class="t-btn" id="btn25" onclick="setView('2025')">2025年</button>
      <button class="t-btn" id="btn24" onclick="setView('2024')">2024年</button>
      <button class="t-btn" id="btnYoY" onclick="setView('yoy')">YoY同期比</button>
      <button class="t-btn" id="btnMoM" onclick="setView('mom')">MoM月增率</button>
    </div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="chart-row">
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="barTitle">前10大客戶</div><div class="card-sub" id="barSub"></div></div>
        <div class="leg-row" id="barLeg"></div>
      </div>
      <div class="chart-wrap" style="height:280px"><canvas id="barC"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title">月趨勢</div><div class="card-sub" id="lineSub"></div></div>
        <div class="leg-row" id="lineLeg"></div>
      </div>
      <div class="chart-wrap" style="height:280px"><canvas id="lineC"></canvas></div>
    </div>
  </div>

  <div class="chart-row2">
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="yoyBarTitle">YoY 年增率（前10名）</div><div class="card-sub" id="yoyBarSub"></div></div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="yoyBarC"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="momBarTitle">MoM 月增率</div><div class="card-sub" id="momBarSub"></div></div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="momBarC"></canvas></div>
    </div>
  </div>

  <div class="tbl-card">
    <div class="tbl-bar">
      <span class="tbl-title">客戶明細</span>
      <input class="srch" id="srch" placeholder="搜尋客戶名稱/編號…" oninput="renderTable()">
      <select class="ctrl" id="tSort" onchange="renderTable()">
        <option value="latest">最新月↓</option>
        <option value="total">累計↓</option>
        <option value="yoy">YoY↓</option>
        <option value="name">名稱</option>
      </select>
      <select class="ctrl" id="tFilter" onchange="renderTable()">
        <option value="all">全部客戶</option>
        <option value="active">最新月有資料</option>
        <option value="new">最新月新增</option>
        <option value="miss">最新月無資料</option>
      </select>
    </div>
    <div class="tbl-wrap"><table><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
    <div class="tbl-foot" id="tFoot"></div>
  </div>
</div>

function handleFile(file) {
  if (!file) return;
  if (typeof XLSX === 'undefined') { alert('讀取模組載入中，請稍候 2 秒再試'); return; }
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb  = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
      const ws  = wb.Sheets[wb.SheetNames[0]];
      const raw = XLSX.utils.sheet_to_json(ws, {defval:null});
      merge2026(raw, file.name);
    } catch(err) { alert('讀取失敗：' + err.message); }
  };
  reader.readAsArrayBuffer(file);
}

function merge2026(rows, fileName) {
  if (!rows.length) return;
  const keys    = Object.keys(rows[0]);
  const newMons = MONTHS.filter(m => keys.includes(m));
  const dRows   = rows.filter(r => r['客戶編號'] && r['客戶編號'] !== '合計' && r['客戶']);

  // 只接受有實際數據的月份
  const activeMons = newMons.filter(m => dRows.some(r => parseFloat(r[m]) > 0));
  if (!activeMons.length) { alert('此 Excel 無有效月份資料'); return; }

  const map = new Map();
  STATE26.customers.forEach(c => map.set(c.id, {...c}));

  dRows.forEach(r => {
    const id = String(r['客戶編號']||''), name = String(r['客戶']||'');
    if (!id) return;
    if (!map.has(id)) map.set(id, {id, name});
    const obj = map.get(id);
    newMons.forEach((m,i) => {
      const v = parseFloat(r[m])||0;
      const t = parseFloat(r[TAX[MONTHS.indexOf(m)]])||0;
      if (v > 0) { obj[m] = v; obj[m+'_tax'] = t; }
    });
  });

  const allMons = [...new Set([...STATE26.months, ...activeMons])];
  allMons.sort((a,b) => MONTHS.indexOf(a)-MONTHS.indexOf(b));

  // ⚠️ 嚴格：只保留 2026 有實際資料的月份資料，不允許寫入 0
  const allC = Array.from(map.values()).filter(c => allMons.some(m => c[m] > 0));

  const added   = activeMons.filter(m => !STATE26.months.includes(m));
  const updated = activeMons.filter(m =>  STATE26.months.includes(m));

  STATE26 = { customers: allC, months: allMons };
  saveStorage();
  updateSavedBar();

  document.getElementById('fileInfo').textContent = '2026年：' + allMons.join('、');
  let msg = '';
  if (added.length)   msg += '✅ 新增 '+added.join('、')+' ';
  if (updated.length) msg += '🔄 更新 '+updated.join('、');
  if (msg) toast(msg.trim());

  renderAll();
  document.getElementById('uploadSection').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}

// ── Saved Bar ──
function updateSavedBar() {
  const bar = document.getElementById('savedBar');
  if (!STATE26.months.length) { bar.style.display='none'; return; }
  bar.style.display = 'flex';
  document.getElementById('mTags').innerHTML = STATE26.months.map(m =>
    `<span class="m-tag">${m}<span class="m-del" onclick="delMonth('${m}')">×</span></span>`
  ).join('');
}

function delMonth(m) {
  if (!confirm('確定刪除 2026年 '+m+' 的資料？')) return;
  STATE26.months = STATE26.months.filter(x => x !== m);
  STATE26.customers = STATE26.customers.map(c => {
    const nc = {...c}; delete nc[m]; delete nc[m+'_tax']; return nc;
  }).filter(c => STATE26.months.some(mo => c[mo] > 0));
  if (!STATE26.months.length) { clearAll(); return; }
  saveStorage(); updateSavedBar(); renderAll();
  toast('🗑 已刪除 2026/'+m);
}

function clearAll() {
  if (!confirm('確定清除所有 2026 年資料？')) return;
  localStorage.removeItem(KEY26);
  STATE26 = { customers: [], months: [] };
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('savedBar').style.display = 'none';
  document.getElementById('uploadSection').style.display = 'flex';
  document.getElementById('fileInfo').textContent = '2026年：尚未載入';
  toast('✅ 已清除');
}

// ── View ──
function setView(v) {
  VIEW = v;
  ['26','25','24','YoY','MoM'].forEach(x => {
    const btn = document.getElementById('btn'+x);
    if (btn) btn.classList.toggle('on',
      (x==='26'&&v==='2026')||(x==='25'&&v==='2025')||(x==='24'&&v==='2024')||
      (x==='YoY'&&v==='yoy')||(x==='MoM'&&v==='mom')
    );
  });
  renderAll();
}

// ── Helpers ──
const C26 = () => STATE26.customers;
const M26 = () => STATE26.months;
const C25 = () => DATA[2025];
const C24 = () => DATA[2024];

function monthTotal(customers, month) {
  return customers.reduce((s,c) => s+(c[month]||0), 0);
}
function find(customers, id) { return customers.find(c=>c.id===id); }
function fmt(v)  { return v>0 ? '$'+Math.round(v).toLocaleString('zh-TW') : '—'; }
function fmtK(v) { return v>=1e6?'$'+Math.round(v/1e6*10)/10+'M':v>=1000?'$'+Math.round(v/1000)+'K':'$'+Math.round(v); }
function fmtPct(a,b) { // (a=新, b=舊) → YoY or MoM %
  if (!b || b===0) return null;
  return ((a-b)/b*100).toFixed(1);
}
function pctTag(pct) {
  if (pct===null) return '<span style="color:var(--text3)">N/A</span>';
  const cls = pct>=0?'p-up':'p-dn';
  return `<span class="pill ${cls}">${pct>=0?'▲':'▼'}${Math.abs(pct)}%</span>`;
}

const COLORS = ['#4f9eff','#36d9a0','#f5a623','#d97bff','#ff6b6b','#4ee6e6','#ffd36b','#ff9f4e','#a8ff78','#fe8ebb'];

function destroyChart(k) { if(CHARTS[k]){ CHARTS[k].destroy(); delete CHARTS[k]; } }

    ];

  } else if (VIEW === '2025') {
    const tot25 = MONTHS.reduce((s,m)=>s+monthTotal(c25,m),0);

    const yoy   = fmtPct(tot25, tot24);

      {lbl:'月平均', val:'$'+Math.round(tot25/12).toLocaleString('zh-TW'), sub:'全年平均', c1:'#d97bff',c2:'#fe8ebb', badge:null},

      {lbl:'月平均', val:'$'+Math.round(tot24/12).toLocaleString('zh-TW'), sub:'全年平均', c1:'#d97bff',c2:'#fe8ebb', badge:null},
      {lbl:'最低月份', val:MONTHS.reduce((b,m)=>monthTotal(c24,m)<monthTotal(c24,b)?m:b,'1月'),

// ── Bar Chart ──
function renderBarChart() {
  if (typeof Chart==='undefined') return;
  const m26=M26(), c26=C26(), c25=C25(), c24=C24();
  let labels, datasets;

  if (VIEW==='2026') {
    if (!m26.length) return;
    const latest = m26[m26.length-1];
    const show   = m26.slice(-3);
    const top10  = [...c26].sort((a,b)=>(b[latest]||0)-(a[latest]||0)).slice(0,10);
    labels   = top10.map(c=>c.name);
    datasets = show.map((m,i)=>({label:m,data:top10.map(c=>c[m]||0),backgroundColor:COLORS[i]+'cc',borderRadius:4,borderSkipped:false}));
    document.getElementById('barTitle').textContent='前10大客戶（2026）';
    document.getElementById('barSub').textContent='依'+latest+'排序';
    document.getElementById('barLeg').innerHTML=show.map((m,i)=>`<div class="leg"><div class="leg-dot" style="background:${COLORS[i]}"></div>${m}</div>`).join('');
  } else if (VIEW==='2025') {
    const tot = c=>MONTHS.reduce((s,m)=>s+(c[m]||0),0);
    const top10 = [...c25].filter(c=>tot(c)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,10);
    labels   = top10.map(c=>c.name);
    datasets = [{label:'2025全年',data:top10.map(c=>tot(c)),backgroundColor:'#8892a4cc',borderRadius:4,borderSkipped:false}];
    document.getElementById('barTitle').textContent='前10大客戶（2025全年）';
    document.getElementById('barSub').textContent='依全年合計排序';
    document.getElementById('barLeg').innerHTML='';
  } else if (VIEW==='2024') {
    const tot = c=>MONTHS.reduce((s,m)=>s+(c[m]||0),0);
    const top10 = [...c24].filter(c=>tot(c)>0).sort((a,b)=>tot(b)-tot(a)).slice(0,10);
    labels   = top10.map(c=>c.name);
    datasets = [{label:'2024全年',data:top10.map(c=>tot(c)),backgroundColor:'#4d5568cc',borderRadius:4,borderSkipped:false}];
    document.getElementById('barTitle').textContent='前10大客戶（2024全年）';
    document.getElementById('barSub').textContent='依全年合計排序';
    document.getElementById('barLeg').innerHTML='';
  } else if (VIEW==='yoy') {
    if (!m26.length) return;
    const shared = m26.filter(m=>MONTHS.includes(m));
    const get26 = c => shared.reduce((s,m)=>s+(c[m]||0),0);
    const get25 = id => { const c=find(c25,id); return c?shared.reduce((s,m)=>s+(c[m]||0),0):0; };
    const get24 = id => { const c=find(c24,id); return c?shared.reduce((s,m)=>s+(c[m]||0),0):0; };
    const top10 = [...c26].sort((a,b)=>get26(b)-get26(a)).slice(0,10);
    labels   = top10.map(c=>c.name);
    datasets = [
      {label:'2026',data:top10.map(c=>get26(c)),backgroundColor:'#4f9effcc',borderRadius:4,borderSkipped:false},
      {label:'2025',data:top10.map(c=>get25(c.id)),backgroundColor:'#8892a488',borderRadius:4,borderSkipped:false},
      {label:'2024',data:top10.map(c=>get24(c.id)),backgroundColor:'#4d556888',borderRadius:4,borderSkipped:false}
    ];
    document.getElementById('barTitle').textContent='前10大客戶 YoY 同期比';
    document.getElementById('barSub').textContent=shared.join('、');
    document.getElementById('barLeg').innerHTML=`<div class="leg"><div class="leg-dot" style="background:#4f9eff"></div>2026</div><div class="leg"><div class="leg-dot" style="background:#8892a4"></div>2025</div><div class="leg"><div class="leg-dot" style="background:#4d5568"></div>2024</div>`;
  } else { // mom
    if (!m26.length) return;
    const latest = m26[m26.length-1];
    const prev   = m26.length>1?m26[m26.length-2]:null;
    const top10  = [...c26].sort((a,b)=>(b[latest]||0)-(a[latest]||0)).slice(0,10);
    labels   = top10.map(c=>c.name);
    datasets = [
      {label:latest,data:top10.map(c=>c[latest]||0),backgroundColor:'#4f9effcc',borderRadius:4,borderSkipped:false},
      ...(prev?[{label:prev,data:top10.map(c=>c[prev]||0),backgroundColor:'#8892a488',borderRadius:4,borderSkipped:false}]:[])
    ];
    document.getElementById('barTitle').textContent='前10大客戶 MoM';
    document.getElementById('barSub').textContent=(prev?prev+' vs ':'')+latest;
    document.getElementById('barLeg').innerHTML=datasets.map((d,i)=>`<div class="leg"><div class="leg-dot" style="background:${i===0?'#4f9eff':'#8892a4'}"></div>${d.label}</div>`).join('');
  }

  destroyChart('bar');
  CHARTS.bar = new Chart(document.getElementById('barC'), {
    type:'bar', data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#8892a4',font:{size:11},maxRotation:30},grid:{display:false},border:{color:'rgba(255,255,255,0.07)'}},
        y:{ticks:{color:'#8892a4',font:{size:11,family:'DM Mono'},callback:v=>fmtK(v)},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}}
      }
    }
  });
}

    ];
    document.getElementById('lineSub').textContent='MoM 月度走勢';
    document.getElementById('lineLeg').innerHTML=`<div class="leg"><div class="leg-dot" style="background:#4f9eff"></div>2026</div><div class="leg"><div class="leg-dot" style="background:#8892a4"></div>2025</div>`;
  }

  destroyChart('line');
  CHARTS.line = new Chart(document.getElementById('lineC'), {
    type:'line', data:{labels:lLabels,datasets:lData},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:lData.length>1,labels:{color:'#8892a4',font:{size:11}}},tooltip:{callbacks:{label:ctx=>' $'+ctx.raw.toLocaleString('zh-TW')}}},
      scales:{
        x:{ticks:{color:'#8892a4',font:{size:12}},grid:{display:false},border:{color:'rgba(255,255,255,0.07)'}},
        y:{ticks:{color:'#8892a4',font:{size:11,family:'DM Mono'},callback:v=>fmtK(v)},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}}
      }
    }
  });
}

// ── YoY Bar (bottom left) ──
function renderYoYBar() {
  if (typeof Chart==='undefined') return;
  const m26=M26(), c26=C26(), c25=C25(), c24=C24();
  if (!m26.length) { destroyChart('yoyBar'); return; }

  const shared = m26.filter(m=>MONTHS.includes(m));
  // YoY per customer: (2026 sum vs 2025 sum for shared months)
  const yoyData = c26.map(c => {
    const v26 = shared.reduce((s,m)=>s+(c[m]||0),0);
    const c25c = find(c25, c.id);
    const v25  = c25c ? shared.reduce((s,m)=>s+(c25c[m]||0),0) : 0;
    const pct  = v25>0 ? ((v26-v25)/v25*100) : null;
    return {name:c.name, pct, v26, v25};
  }).filter(d=>d.pct!==null).sort((a,b)=>b.v26-a.v26).slice(0,10);

  document.getElementById('yoyBarTitle').textContent = 'YoY 年增率（2026 vs 2025）';
  document.getElementById('yoyBarSub').textContent   = shared.join('、')+' 同期';

  destroyChart('yoyBar');
  CHARTS.yoyBar = new Chart(document.getElementById('yoyBarC'), {
    type:'bar',
    data:{
      labels: yoyData.map(d=>d.name),
      datasets:[{ label:'YoY%', data:yoyData.map(d=>parseFloat(d.pct.toFixed(1))),
        backgroundColor: yoyData.map(d=>d.pct>=0?'rgba(54,217,160,0.7)':'rgba(255,95,87,0.7)'),
        borderRadius:4, borderSkipped:false }]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw>=0?'+':''}${ctx.raw}%`}}},
      scales:{
        x:{ticks:{color:'#8892a4',font:{size:10},maxRotation:30},grid:{display:false},border:{display:false}},
        y:{ticks:{color:'#8892a4',font:{size:10,family:'DM Mono'},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}}
      }
    }
  });
}

// ── MoM Bar (bottom right) ──
function renderMoMBar() {
  if (typeof Chart==='undefined') return;
  const m26=M26(), c26=C26(), c25=C25();
  if (m26.length < 2) { destroyChart('momBar'); return; }

  const latest = m26[m26.length-1];
  const prev   = m26[m26.length-2];

  const momData = c26.map(c => {
    const vL = c[latest]||0;
    const vP = c[prev]||0;
    const pct = vP>0 ? ((vL-vP)/vP*100) : null;
    return {name:c.name, pct, vL};
  }).filter(d=>d.pct!==null).sort((a,b)=>b.vL-a.vL).slice(0,10);

  document.getElementById('momBarTitle').textContent = `MoM 月增率（${prev} → ${latest}）`;
  document.getElementById('momBarSub').textContent   = '2026年';

  destroyChart('momBar');
  CHARTS.momBar = new Chart(document.getElementById('momBarC'), {
    type:'bar',
    data:{
      labels: momData.map(d=>d.name),
      datasets:[{ label:'MoM%', data:momData.map(d=>parseFloat(d.pct.toFixed(1))),
        backgroundColor: momData.map(d=>d.pct>=0?'rgba(79,158,255,0.7)':'rgba(255,95,87,0.7)'),
        borderRadius:4, borderSkipped:false }]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.raw>=0?'+':''}${ctx.raw}%`}}},
      scales:{
        x:{ticks:{color:'#8892a4',font:{size:10},maxRotation:30},grid:{display:false},border:{display:false}},
        y:{ticks:{color:'#8892a4',font:{size:10,family:'DM Mono'},callback:v=>v+'%'},grid:{color:'rgba(255,255,255,0.05)'},border:{display:false}}
      }
    }
  });
}

// ── Table Head ──
function renderTableHead() {
  const m26=M26(), c25=C25(), c24=C24();
  if (!m26.length) return;
  const latest = m26[m26.length-1];
  const prev   = m26.length>1?m26[m26.length-2]:null;
  document.getElementById('tHead').innerHTML = `<tr>
    <th>編號</th><th>客戶</th>
    ${prev?`<th class="r">${prev}</th>`:''}
    <th class="r">${latest}</th>
    <th class="r">稅金(${latest})</th>
    <th class="r">MoM</th>
    <th class="r">YoY vs 2025</th>
    <th class="r">YoY vs 2024</th>
    <th class="r">累計</th>
    <th>趨勢</th>
  </tr>`;
}

// ── Table Body ──
function renderTable() {
  const m26=M26(), c26=C26(), c25=C25(), c24=C24();
  if (!m26.length) return;
  const latest = m26[m26.length-1];
  const prev   = m26.length>1?m26[m26.length-2]:null;

  const q    = document.getElementById('srch').value.trim().toLowerCase();
  const sort = document.getElementById('tSort').value;
  const filt = document.getElementById('tFilter').value;

  let data = c26.filter(c => {
    if (q && !c.name.toLowerCase().includes(q) && !c.id.toLowerCase().includes(q)) return false;
    if (filt==='active')  return c[latest]>0;
    if (filt==='new')     return c[latest]>0&&(!prev||!c[prev]);
    if (filt==='miss')    return !c[latest]&&m26.some(m=>m!==latest&&c[m]>0);
    return true;
  });

  const total  = c => m26.reduce((s,m)=>s+(c[m]||0),0);
  const yoy25  = c => { const x=find(c25,c.id); return x?fmtPct(c[latest]||0,x[latest]||0):null; };
  const yoy24  = c => { const x=find(c24,c.id); return x?fmtPct(c[latest]||0,x[latest]||0):null; };
  const mom    = c => prev?fmtPct(c[latest]||0,c[prev]||0):null;

  if (sort==='latest') data.sort((a,b)=>(b[latest]||0)-(a[latest]||0));
  else if(sort==='total') data.sort((a,b)=>total(b)-total(a));
  else if(sort==='yoy')   data.sort((a,b)=>{const ya=parseFloat(yoy25(a))||0,yb=parseFloat(yoy25(b))||0;return yb-ya;});
  else data.sort((a,b)=>a.name.localeCompare(b.name,'zh-TW'));

  function badge(c) {
    if(!prev) return '';
    if(c[latest]>0&&!c[prev]) return '<span class="pill p-new">新增</span>';
    if(!c[latest]&&c[prev]>0) return '<span class="pill p-na">本月無</span>';
    if(c[latest]>0&&c[prev]>0){
      const p=((c[latest]-c[prev])/c[prev]*100).toFixed(0);
      return c[latest]>=c[prev]?`<span class="pill p-up">▲${p}%</span>`:`<span class="pill p-dn">▼${Math.abs(p)}%</span>`;
    }
    return '';
  }

  document.getElementById('tBody').innerHTML = data.map(c=>{
    const y25 = yoy25(c), y24 = yoy24(c), mo = mom(c);
    return `<tr>
      <td class="dim">${c.id}</td>
      <td style="font-weight:500">${c.name}</td>
      ${prev?`<td class="r" style="color:var(--text2)">${fmt(c[prev]||0)}</td>`:''}
      <td class="r">${fmt(c[latest]||0)}</td>
      <td class="r dim">${fmt(c[latest+'_tax']||0)}</td>
      <td class="r">${pctTag(mo)}</td>
      <td class="r">${pctTag(y25)}</td>
      <td class="r">${pctTag(y24)}</td>
      <td class="r" style="font-weight:500">${fmt(total(c))}</td>
      <td>${badge(c)}</td>
    </tr>`;
  }).join('');

  document.getElementById('tFoot').textContent = `顯示 ${data.length} 筆 / 共 ${c26.length} 筆`;
}

// ── Auto-load ──
window.addEventListener('load', () => {
  const ok = loadStorage();
  if (ok) {
    document.getElementById('fileInfo').textContent = '2026年：'+STATE26.months.join('、');
    updateSavedBar();
    renderAll();
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
  }
});
</script>
</body>
