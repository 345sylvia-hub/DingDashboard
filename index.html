<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sylvia Core</title>
<script>
(function(){
  function load(src,ok,err){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s);}
  var xu=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
  var cu=['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js','https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js'];
  function tryX(i){if(i>=xu.length)return;load(xu[i],function(){tryC(0);},function(){tryX(i+1);});}
  function tryC(i){if(i>=cu.length)return;load(cu[i],function(){console.log('ready');},function(){tryC(i+1);});}
  tryX(0);
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#FFFFFF;--surface:#F8F8FA;--surface2:#EEF0F5;
  --border:rgba(30,45,90,0.1);
  --accent:#1E2D5A;--accent2:#FF6B47;--accent3:#00C48C;
  --danger:#FF4D6D;--purple:#8B5CF6;
  --text:#1E2D5A;--text2:#5A657D;--text3:#94A3B8;
  --radius:12px;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;--header-font:'Outfit',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:#1E2D5A;position:sticky;top:0;z-index:100;color:#FFFFFF}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#FF6B47,#FF8847);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;font-family:var(--header-font)}
.logo-text{font-size:15px;font-weight:700;font-family:var(--header-font);color:#FFFFFF}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.7);margin-top:1px;font-family:var(--header-font)}
.hdr-right{display:flex;align-items:center;gap:10px}
#fileInfo{font-size:11px;color:rgba(255,255,255,0.8);font-family:var(--mono)}

/* Toast */
#toast{display:none;position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#00C48C;color:#FFFFFF;padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.1)}

/* Upload */
#uploadSection{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:40px}
.drop-zone{width:100%;max-width:500px;border:2px dashed var(--border);border-radius:20px;padding:56px 40px;text-align:center;cursor:pointer;transition:all .25s;background:var(--surface);box-shadow:0 10px 30px rgba(30,45,90,0.05)}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent2);background:#FFFFFF;transform:translateY(-2px)}
.drop-icon{font-size:40px;margin-bottom:16px}
.drop-title{font-size:18px;font-weight:700;margin-bottom:8px;font-family:var(--header-font)}
.drop-sub{font-size:13px;color:var(--text2);line-height:1.6}
.drop-btn{display:inline-block;margin-top:22px;padding:10px 24px;background:var(--accent2);color:#fff;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.drop-hint{margin-top:14px;font-size:11px;color:var(--text3);font-family:var(--mono)}
.data-status{margin-top:20px;padding:14px 20px;background:rgba(0,196,140,.08);border:1px solid rgba(0,196,140,.2);border-radius:10px;font-size:12px;color:#00C48C;max-width:500px;width:100%;line-height:1.8}

/* SavedBar */
#savedBar{display:none;padding:9px 28px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);align-items:center;gap:8px;flex-wrap:wrap}
.m-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.m-del{cursor:pointer;color:var(--text3);margin-left:2px}
.m-del:hover{color:var(--danger)}
.btn-clear{margin-left:auto;padding:3px 9px;border-radius:5px;border:1px solid rgba(255,77,109,.3);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:var(--sans)}

/* Dashboard */
#dashboard{display:none;padding:22px 28px 40px}

/* View bar */
.view-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.view-title{font-size:16px;font-weight:700;margin-right:auto;letter-spacing:-.01em;font-family:var(--header-font)}
.view-title span{color:var(--accent2)}
.toggle-grp{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.t-btn{padding:6px 16px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--sans);transition:all .15s}
.t-btn.on{background:var(--accent);color:#fff}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden;box-shadow:0 4px 12px rgba(30,45,90,0.03)}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#1E2D5A,#FF6B47)}
.kpi-lbl{font-size:10.5px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;font-family:var(--header-font)}
.kpi-val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em;color:var(--text)}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:5px}
.kpi-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:4px;margin-top:4px}
.b-up{background:rgba(0,196,140,.12);color:#00C48C}
.b-dn{background:rgba(255,77,109,.12);color:#FF4D6D}

/* Charts */
.chart-row{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:20px}
.chart-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 4px 12px rgba(30,45,90,0.03)}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:700;font-family:var(--header-font)}
.card-sub{font-size:11px;color:var(--text2)}
.leg-row{display:flex;gap:12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:2px}
.chart-wrap{position:relative}

/* Table */
.tbl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:0 4px 12px rgba(30,45,90,0.03)}
.tbl-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-title{font-size:13px;font-weight:700;margin-right:auto;font-family:var(--header-font)}
.srch{background:#FFFFFF;border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;width:170px}
.srch:focus{border-color:var(--accent)}
.srch::placeholder{color:var(--text3)}
select.ctrl{background:#FFFFFF;border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:10px 13px;text-align:left;font-size:10.5px;font-weight:700;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--surface);font-family:var(--header-font)}
thead th.r{text-align:right}
tbody td{padding:9px 13px;border-bottom:1px solid rgba(30,45,90,.05);white-space:nowrap}
tbody td.r{text-align:right;font-family:var(--mono);font-size:12px}
tbody td.dim{color:var(--text2);font-family:var(--mono);font-size:11px}
tbody tr:hover td{background:rgba(30,45,90,.02)}
tbody tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500;font-family:var(--mono)}
.p-up{background:rgba(0,196,140,.15);color:#00C48C}
.p-dn{background:rgba(255,77,109,.15);color:#FF4D6D}
.p-new{background:rgba(255,107,71,.15);color:#FF6B47}
.p-na{background:rgba(148,163,184,.15);color:#94A3B8}
.tbl-foot{padding:9px 18px;font-size:11px;color:var(--text3);text-align:right;border-top:1px solid var(--border);font-family:var(--mono)}

.btn-hdr{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#FFFFFF;font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .2s}
.btn-hdr:hover{background:rgba(255,255,255,0.2);color:#FFFFFF}

@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.chart-row,.chart-row2{grid-template-columns:1fr}#dashboard{padding:14px}header{padding:12px 14px}}
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <div class="logo">
    <div class="logo-mark">識</div>
    <div><div class="logo-text">Sylvia Finance</div><div class="logo-sub">Finance Hub</div></div>
  </div>
  <div class="hdr-right">
    <span id="fileInfo">2026年：尚未載入</span>
    <button class="btn-hdr" onclick="document.getElementById('fi2').click()">➕ 新增月份</button>
    <input type="file" id="fi2" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
  </div>
</header>

<div id="savedBar">
  <span>2026已儲存：</span>
  <div id="mTags"></div>
  <button class="btn-clear" onclick="clearAll()">🗑 清除2026資料</button>
</div>

<div id="uploadSection">
  <div class="drop-zone" id="dz">
    <div class="drop-icon">📊</div>
    <div class="drop-title">拖曳 2026 年 Excel 到這裡</div>
    <div class="drop-sub">每月上傳自動疊加，不覆蓋舊資料<br>2024、2025 全年資料已內建</div>
    <label class="drop-btn" for="fi">選擇檔案</label>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
    <div class="drop-hint">支援格式：.xlsx / .xls</div>
  </div>
  <div class="data-status">
    ✅ 2024 全年內建（1-12月）<br>
    ✅ 2025 全年內建（1-12月）<br>
    ⬆ 請上傳 2026 年 Excel，系統自動計算 YoY & MoM
  </div>
</div>

<div id="dashboard">
  <div class="view-bar">
    <div class="view-title" id="vTitle">應收帳款分析</div>
    <div class="toggle-grp">
      <button class="t-btn on" id="btn26" onclick="setView('2026')">2026年</button>
      <button class="t-btn" id="btn25" onclick="setView('2025')">2025年</button>
      <button class="t-btn" id="btn24" onclick="setView('2024')">2024年</button>
      <button class="t-btn" id="btnYoY" onclick="setView('yoy')">YoY同期比</button>
      <button class="t-btn" id="btnMoM" onclick="setView('mom')">MoM月增率</button>
    </div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="chart-row">
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="barTitle">前10大客戶</div><div class="card-sub" id="barSub"></div></div>
        <div class="leg-row" id="barLeg"></div>
      </div>
      <div class="chart-wrap" style="height:280px"><canvas id="barC"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title">月趨勢</div><div class="card-sub" id="lineSub"></div></div>
        <div class="leg-row" id="lineLeg"></div>
      </div>
      <div class="chart-wrap" style="height:280px"><canvas id="lineC"></canvas></div>
    </div>
  </div>

  <div class="chart-row2">
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="yoyBarTitle">YoY 年增率（前10名）</div><div class="card-sub" id="yoyBarSub"></div></div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="yoyBarC"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="momBarTitle">MoM 月增率</div><div class="card-sub" id="momBarSub"></div></div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="momBarC"></canvas></div>
    </div>
  </div>

  <div class="tbl-card">
    <div class="tbl-bar">
      <span class="tbl-title">客戶明細</span>
      <input class="srch" id="srch" placeholder="搜尋客戶名稱/編號…" oninput="renderTable()">
      <select class="ctrl" id="tSort" onchange="renderTable()">
        <option value="latest">最新月↓</option>
        <option value="total">累計↓</option>
        <option value="yoy">YoY↓</option>
        <option value="name">名稱</option>
      </select>
      <select class="ctrl" id="tFilter" onchange="renderTable()">
        <option value="all">全部客戶</option>
        <option value="active">最新月有資料</option>
        <option value="new">最新月新增</option>
        <option value="miss">最新月無資料</option>
      </select>
    </div>
    <div class="tbl-wrap"><table><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
    <div class="tbl-foot" id="tFoot"></div>
  </div>
</div>
