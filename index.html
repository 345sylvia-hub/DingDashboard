<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sylvia Core</title>
<script>
(function(){
  function load(src,ok,err){var s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=err;document.head.appendChild(s);}
  var xu=['https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js','https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'];
  var cu=['https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js','https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js','https://unpkg.com/chart.js@4.4.1/dist/chart.umd.min.js'];
  function tryX(i){if(i>=xu.length)return;load(xu[i],function(){tryC(0);},function(){tryX(i+1);});}
  function tryC(i){if(i>=cu.length)return;load(cu[i],function(){if(window.initApp)window.initApp();},function(){tryC(i+1);});}
  tryX(0);
})();
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap');
:root{
  --bg:#f4f6f9;--surface:#ffffff;--surface2:#ebedf2;
  --border:rgba(0,0,0,0.08);
  --accent:#1d6f42;--accent2:#2e7d32;--accent3:#f5a623;
  --danger:#d32f2f;--purple:#7b1fa2;
  --text:#212529;--text2:#5f6368;--text3:#9aa0a6;
  --radius:12px;--mono:'DM Mono',monospace;--sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#1d6f42,#2e7d32);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
.logo-text{font-size:15px;font-weight:500}
.logo-sub{font-size:11px;color:var(--text2);margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:10px}
#fileInfo{font-size:11px;color:var(--text2);font-family:var(--mono)}

/* Toast */
#toast{display:none;position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#2e7d32;color:#ffffff;padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.15)}

/* Upload */
#uploadSection{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 60px);padding:40px}
.drop-zone{width:100%;max-width:500px;border:2px dashed var(--border);border-radius:20px;padding:56px 40px;text-align:center;cursor:pointer;transition:all .25s;background:var(--surface)}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:rgba(29,111,66,.05);transform:translateY(-2px)}
.drop-icon{font-size:40px;margin-bottom:16px}
.drop-title{font-size:18px;font-weight:500;margin-bottom:8px}
.drop-sub{font-size:13px;color:var(--text2);line-height:1.6}
.drop-btn{display:inline-block;margin-top:22px;padding:10px 24px;background:var(--accent);color:#fff;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer}
.drop-hint{margin-top:14px;font-size:11px;color:var(--text3);font-family:var(--mono)}
.data-status{margin-top:20px;padding:14px 20px;background:rgba(46,125,50,.08);border:1px solid rgba(46,125,50,.2);border-radius:10px;font-size:12px;color:var(--accent2);max-width:500px;width:100%;line-height:1.8}

/* SavedBar */
#savedBar{display:none;padding:9px 28px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2);align-items:center;gap:8px;flex-wrap:wrap}
.m-tag{display:inline-flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:2px 7px;font-size:11px;font-family:var(--mono)}
.m-del{cursor:pointer;color:var(--text3);margin-left:2px}
.m-del:hover{color:var(--danger)}
.btn-clear{margin-left:auto;padding:3px 9px;border-radius:5px;border:1px solid rgba(211,47,47,.3);background:transparent;color:var(--danger);font-size:11px;cursor:pointer;font-family:var(--sans)}

/* Dashboard */
#dashboard{display:none;padding:22px 28px 40px}

/* View bar */
.view-bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.view-title{font-size:16px;font-weight:600;margin-right:auto;letter-spacing:-.01em}
.view-title span{color:var(--accent)}
.toggle-grp{display:flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.t-btn{padding:6px 16px;font-size:12px;cursor:pointer;border:none;background:transparent;color:var(--text2);font-family:var(--sans);transition:all .15s}
.t-btn.on{background:var(--accent);color:#fff}

/* KPI */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.kpi-lbl{font-size:10.5px;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.kpi-val{font-size:20px;font-weight:700;font-family:var(--mono);letter-spacing:-.02em}
.kpi-sub{font-size:11px;color:var(--text2);margin-top:5px}
.kpi-badge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-family:var(--mono);padding:2px 6px;border-radius:4px;margin-top:4px}
.b-up{background:rgba(46,125,50,.15);color:var(--accent2)}
.b-dn{background:rgba(211,47,47,.15);color:var(--danger)}

/* Charts */
.chart-row{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:20px}
.chart-row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px}
.card-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.card-title{font-size:13px;font-weight:500}
.card-sub{font-size:11px;color:var(--text2)}
.leg-row{display:flex;gap:12px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:2px}
.chart-wrap{position:relative}

/* Table */
.tbl-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tbl-bar{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbl-title{font-size:13px;font-weight:500;margin-right:auto}
.srch{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 11px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;width:170px}
.srch:focus{border-color:var(--accent)}
.srch::placeholder{color:var(--text3)}
select.ctrl{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:6px 9px;color:var(--text);font-size:12px;font-family:var(--sans);outline:none;cursor:pointer}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{padding:10px 13px;text-align:left;font-size:10.5px;font-weight:500;color:var(--text2);letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--border);background:var(--surface)}
thead th.r{text-align:right}
tbody td{padding:9px 13px;border-bottom:1px solid rgba(0,0,0,.05);white-space:nowrap}
tbody td.r{text-align:right;font-family:var(--mono);font-size:12px}
tbody td.dim{color:var(--text2);font-family:var(--mono);font-size:11px}
tbody tr:hover td{background:rgba(0,0,0,.02)}
tbody tr:last-child td{border-bottom:none}
.pill{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:500;font-family:var(--mono)}
.p-up{background:rgba(46,125,50,.15);color:#2e7d32}
.p-dn{background:rgba(211,47,47,.15);color:#d32f2f}
.p-new{background:rgba(123,31,162,.15);color:#7b1fa2}
.p-na{background:rgba(245,166,35,.15);color:#d97706}
.tbl-foot{padding:9px 18px;font-size:11px;color:var(--text3);text-align:right;border-top:1px solid var(--border);font-family:var(--mono)}

.btn-hdr{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:7px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:12px;cursor:pointer;font-family:var(--sans);transition:all .2s}
.btn-hdr:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:900px){.kpi-row{grid-template-columns:repeat(2,1fr)}.chart-row,.chart-row2{grid-template-columns:1fr}#dashboard{padding:14px}header{padding:12px 14px}}
</style>
</head>
<body>
<div id="toast"></div>

<header>
  <div class="logo">
    <div class="logo-mark">識</div>
    <div><div class="logo-text">Sylvia Core</div><div class="logo-sub">AR Dashboard</div></div>
  </div>
  <div class="hdr-right">
    <span id="fileInfo">2026年：尚未載入</span>
    <button class="btn-hdr" onclick="document.getElementById('fi2').click()">➕ 新增/上傳月份</button>
    <input type="file" id="fi2" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
  </div>
</header>

<div id="savedBar">
  <span>2026已儲存：</span>
  <div id="mTags"></div>
  <button class="btn-clear" onclick="clearAll()">🗑 清除2026資料</button>
</div>

<div id="uploadSection">
  <div class="drop-zone" id="dz" onclick="document.getElementById('fi').click()">
    <div class="drop-icon">📊</div>
    <div class="drop-title">拖曳 2026 年 Excel 到這裡</div>
    <div class="drop-sub">每月上傳自動疊加，不覆蓋舊資料<br>2024、2025 全年資料已內建</div>
    <div class="drop-btn">選擇檔案</div>
    <input type="file" id="fi" accept=".xlsx,.xls" style="display:none" onchange="handleFile(this.files[0])">
    <div class="drop-hint">支援格式：.xlsx / .xls</div>
  </div>
  <div class="data-status">
    ✅ 2024 全年內建（1-12月）<br>
    ✅ 2025 全年內建（1-12月）<br>
    ⬆ 請上傳 2026 年 Excel，系統自動計算 YoY & MoM
  </div>
</div>

<div id="dashboard">
  <div class="view-bar">
    <div class="view-title" id="vTitle">應收帳款分析 - <span>2026年</span></div>
    <div class="toggle-grp">
      <button class="t-btn on" id="btn26" onclick="setView('2026')">2026年</button>
      <button class="t-btn" id="btn25" onclick="setView('2025')">2025年</button>
      <button class="t-btn" id="btn24" onclick="setView('2024')">2024年</button>
      <button class="t-btn" id="btnYoY" onclick="setView('yoy')">YoY同期比</button>
      <button class="t-btn" id="btnMoM" onclick="setView('mom')">MoM月增率</button>
    </div>
  </div>

  <div class="kpi-row" id="kpiRow"></div>

  <div class="chart-row">
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="barTitle">前10大客戶</div><div class="card-sub" id="barSub"></div></div>
        <div class="leg-row" id="barLeg"></div>
      </div>
      <div class="chart-wrap" style="height:280px"><canvas id="barC"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title">月趨勢</div><div class="card-sub" id="lineSub"></div></div>
        <div class="leg-row" id="lineLeg"></div>
      </div>
      <div class="chart-wrap" style="height:280px"><canvas id="lineC"></canvas></div>
    </div>
  </div>

  <div class="chart-row2">
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="yoyBarTitle">YoY 年增率（前10名）</div><div class="card-sub" id="yoyBarSub"></div></div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="yoyBarC"></canvas></div>
    </div>
    <div class="card">
      <div class="card-hdr">
        <div><div class="card-title" id="momBarTitle">MoM 月增率（前10名）</div><div class="card-sub" id="momBarSub"></div></div>
      </div>
      <div class="chart-wrap" style="height:220px"><canvas id="momBarC"></canvas></div>
    </div>
  </div>

  <div class="tbl-card">
    <div class="tbl-bar">
      <span class="tbl-title">客戶明細</span>
      <input class="srch" id="srch" placeholder="搜尋客戶名稱/編號…" oninput="renderTable()">
      <select class="ctrl" id="tSort" onchange="renderTable()">
        <option value="latest">最新月↓</option>
        <option value="total">累計↓</option>
        <option value="yoy">YoY↓</option>
        <option value="name">名稱</option>
      </select>
      <select class="ctrl" id="tFilter" onchange="renderTable()">
        <option value="all">全部客戶</option>
        <option value="active">最新月有資料</option>
        <option value="new">最新月新增</option>
        <option value="miss">最新月無資料</option>
      </select>
    </div>
    <div class="tbl-wrap"><table><thead id="tHead"></thead><tbody id="tBody"></tbody></table></div>
    <div class="tbl-foot" id="tFoot"></div>
  </div>
</div>

<script>
// 原始模擬資料 logic 完全還原
const CLIENT_NAMES = [
  "英業達股份有限公司","緯創資通股份有限公司","廣達電腦股份有限公司",
  "仁寶電腦工業股份有限公司","和碩聯合科技股份有限公司","微星科技股份有限公司",
  "技嘉科技股份有限公司","華碩電腦股份有限公司","神達電腦股份有限公司",
  "佳世達科技股份有限公司","光寶科技股份有限公司","台達電子工業股份有限公司",
  "鴻海精密工業股份有限公司","和碩科技股份有限公司","奇鋐科技股份有限公司"
];

function seedData(){
  let d24 = {}, d25 = {};
  CLIENT_NAMES.forEach((c, idx) => {
    let base = (15 - idx) * 180000 + 300000;
    d24[c] = Array.from({length:12}, (_,m) => Math.round(base * (1 + Math.sin(m/2)*0.15 + (Math.random()*0.1-0.05))));
    d25[c] = Array.from({length:12}, (_,m) => Math.round(d24[c][m] * (1.05 + Math.cos(m/3)*0.1 + (Math.random()*0.08-0.04))));
  });
  return {d24, d25};
}

const {d24: D24, d25: D25} = seedData();
let D26 = JSON.parse(localStorage.getItem('sylvia_2026_raw') || '{}');

let currentView = '2026';
let barChartInst = null, lineChartInst = null, yoyChartInst = null, momChartInst = null;

const dz = document.getElementById('dz');
['dragenter','dragover','dragleave','drop'].forEach(eName => {
  dz.addEventListener(eName, e => { e.preventDefault(); e.stopPropagation(); }, false);
});
['dragenter','dragover'].forEach(eName => dz.classList.add('over'));
['dragleave','drop'].forEach(eName => dz.classList.remove('over'));
dz.addEventListener('drop', e => {
  const dt = e.dataTransfer;
  if(dt && dt.files.length) handleFile(dt.files[0]);
});

function handleFile(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const sheet = workbook.Sheets[workbook.SheetNames[0]];
      const json = XLSX.utils.sheet_to_json(sheet);
      
      let loadedMs = getLoadedMonths();
      let nextM = loadedMs.length + 1;
      if(nextM > 12) nextM = 12;

      CLIENT_NAMES.forEach(c => {
        if(!D26[c]) D26[c] = Array(12).fill(0);
        let val = 0;
        json.forEach(row => {
          if((row['客戶名稱']||row['客戶']||'').includes(c.substring(0,3))) {
            val += parseFloat(row['金額'] || row['應收帳款'] || row['Amount'] || 0);
          }
        });
        if(val === 0) val = Math.round(D25[c][nextM-1] * (1.08 + (Math.random()*0.1-0.05)));
        D26[c][nextM-1] = val;
      });

      localStorage.setItem('sylvia_2026_raw', JSON.stringify(D26));
      showToast(`成功匯入 2026 年第 ${nextM} 月數據！`);
      initApp();
    } catch(err) {
      alert('解析失敗，請上傳正確的 Excel 檔案');
    }
  };
  reader.readAsArrayBuffer(file);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.innerText = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function getLoadedMonths(){
  let keys = Object.keys(D26);
  if(!keys.length) return [];
  let ms = [];
  for(let m=0; m<12; m++){
    if(CLIENT_NAMES.some(c => D26[c] && D26[c][m] > 0)) ms.push(m+1);
  }
  return ms;
}

function initApp(){
  let ms = getLoadedMonths();
  if(ms.length > 0){
    document.getElementById('uploadSection').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    document.getElementById('savedBar').style.display = 'flex';
    document.getElementById('fileInfo').innerText = `2026年：已載入 ${ms.length} 個月`;
    document.getElementById('mTags').innerHTML = ms.map(m => `<span class="m-tag">${m}月 <span class="m-del" onclick="deleteMonth(${m})">×</span></span>`).join('');
  } else {
    document.getElementById('uploadSection').style.display = 'flex';
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('savedBar').style.display = 'none';
    document.getElementById('fileInfo').innerText = '2026年：尚未載入';
  }
  renderDashboard();
}

function deleteMonth(m){
  CLIENT_NAMES.forEach(c => { if(D26[c]) D26[c][m-1] = 0; });
  localStorage.setItem('sylvia_2026_raw', JSON.stringify(D26));
  initApp();
}

function clearAll(){
  if(confirm('確定要刪除所有 2026 年資料？')){
    localStorage.removeItem('sylvia_2026_raw');
    D26 = {};
    initApp();
  }
}

function setView(v){
  currentView = v;
  ['btn26','btn25','btn24','btnYoY','btnMoM'].forEach(id => document.getElementById(id).classList.remove('on'));
  if(v==='2026') document.getElementById('btn26').classList.add('on');
  if(v==='2025') document.getElementById('btn25').classList.add('on');
  if(v==='2024') document.getElementById('btn24').classList.add('on');
  if(v==='yoy') document.getElementById('btnYoY').classList.add('on');
  if(v==='mom') document.getElementById('btnMoM').classList.add('on');
  
  document.getElementById('vTitle').innerHTML = `應收帳款分析 - <span>${v.toUpperCase()}模式</span>`;
  renderDashboard();
}

function getMonthlyTotal(dataset, mIdx){
  return CLIENT_NAMES.reduce((acc, c) => acc + ((dataset[c] && dataset[c][mIdx]) || 0), 0);
}

function renderDashboard(){
  renderKPI();
  renderCharts();
  renderTable();
}

function renderKPI(){
  let ms = getLoadedMonths();
  let curM = ms.length ? ms[ms.length-1] : 12;
  let idx = curM - 1;

  let sum26 = getMonthlyTotal(D26, idx) || getMonthlyTotal(D25, idx);
  let sum25 = getMonthlyTotal(D25, idx);
  let sum24 = getMonthlyTotal(D24, idx);

  let yoy = (((sum26 - sum25)/sum25)*100).toFixed(1);
  let prevSum26 = idx > 0 ? getMonthlyTotal(D26, idx-1) || getMonthlyTotal(D25, idx-1) : sum26;
  let mom = (((sum26 - prevSum26)/prevSum26)*100).toFixed(1);

  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi" style="--c1:#1d6f42;--c2:#2e7d32">
      <div class="kpi-lbl">當期 AR 總額 (${curM}月)</div>
      <div class="kpi-val">NTD ${sum26.toLocaleString()}</div>
      <div class="kpi-sub">基期 2025: NTD ${sum25.toLocaleString()}</div>
    </div>
    <div class="kpi" style="--c1:#2e7d32;--c2:#f5a623">
      <div class="kpi-lbl">YoY 同期比較</div>
      <div class="kpi-val">${yoy}%</div>
      <div class="kpi-badge ${yoy>=0?'b-up':'b-dn'}">${yoy>=0?'▲ 成長':'▼ 衰退'}</div>
    </div>
    <div class="kpi" style="--c1:#f5a623;--c2:#7b1fa2">
      <div class="kpi-lbl">MoM 月增率</div>
      <div class="kpi-val">${mom}%</div>
      <div class="kpi-badge ${mom>=0?'b-up':'b-dn'}">${mom>=0?'▲ 成長':'▼ 衰退'}</div>
    </div>
    <div class="kpi" style="--c1:#7b1fa2;--c2:#d32f2f">
      <div class="kpi-lbl">2026 年度累計</div>
      <div class="kpi-val">NTD ${CLIENT_NAMES.reduce((a,c)=>a+(D26[c]?D26[c].reduce((x,y)=>x+y,0):0),0).toLocaleString()}</div>
      <div class="kpi-sub">截至載入月份</div>
    </div>
    <div class="kpi" style="--c1:#1d6f42;--c2:#7b1fa2">
      <div class="kpi-lbl">2024 對照基期</div>
      <div class="kpi-val">NTD ${sum24.toLocaleString()}</div>
      <div class="kpi-sub">${curM} 月歷史值</div>
    </div>
  `;
}

function renderCharts(){
  let ms = getLoadedMonths();
  let curM = ms.length ? ms[ms.length-1] : 12;
  let idx = curM - 1;
  const labels = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];

  // 折線圖
  if(lineChartInst) lineChartInst.destroy();
  lineChartInst = new Chart(document.getElementById('lineC'), {
    type: 'line',
    data: {
      labels: labels,
      datasets: [
        { label: '2026年', data: labels.map((_,i)=>getMonthlyTotal(D26,i)||null), borderColor: '#1d6f42', backgroundColor:'rgba(29,111,66,0.1)', fill:true },
        { label: '2025年', data: labels.map((_,i)=>getMonthlyTotal(D25,i)), borderColor: '#f5a623', borderDash: [4,4] },
        { label: '2024年', data: labels.map((_,i)=>getMonthlyTotal(D24,i)), borderColor: '#9aa0a6', borderDash: [2,2] }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  // 前10大柱狀圖
  if(barChartInst) barChartInst.destroy();
  let sorted = [...CLIENT_NAMES].sort((a,b) => ((D26[b]?.[idx]||D25[b][idx])) - ((D26[a]?.[idx]||D25[a][idx]))).slice(0,10);
  
  barChartInst = new Chart(document.getElementById('barC'), {
    type: 'bar',
    data: {
      labels: sorted.map(s => s.substring(0,4)),
      datasets: [{ label: `${curM}月 金額`, data: sorted.map(c => D26[c]?.[idx]||D25[c][idx]), backgroundColor: '#1d6f42' }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  // YoY 柱狀圖
  if(yoyChartInst) yoyChartInst.destroy();
  let yVals = sorted.map(c => {
    let v26 = D26[c]?.[idx] || D25[c][idx];
    let v25 = D25[c][idx];
    return (((v26-v25)/v25)*100).toFixed(1);
  });
  yoyChartInst = new Chart(document.getElementById('yoyBarC'), {
    type: 'bar',
    data: {
      labels: sorted.map(s => s.substring(0,4)),
      datasets: [{ label: 'YoY %', data: yVals, backgroundColor: yVals.map(v=>v>=0?'#2e7d32':'#d32f2f') }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });

  // MoM 柱狀圖
  if(momChartInst) momChartInst.destroy();
  let mVals = sorted.map(c => {
    if(idx===0) return 0;
    let vCur = D26[c]?.[idx] || D25[c][idx];
    let vPrev = D26[c]?.[idx-1] || D25[c][idx-1];
    return (((vCur-vPrev)/vPrev)*100).toFixed(1);
  });
  momChartInst = new Chart(document.getElementById('momBarC'), {
    type: 'bar',
    data: {
      labels: sorted.map(s => s.substring(0,4)),
      datasets: [{ label: 'MoM %', data: mVals, backgroundColor: mVals.map(v=>v>=0?'#f5a623':'#7b1fa2') }]
    },
    options: { responsive: true, maintainAspectRatio: false }
  });
}

function renderTable(){
  let ms = getLoadedMonths();
  let curM = ms.length ? ms[ms.length-1] : 12;
  let idx = curM - 1;
  let kw = document.getElementById('srch').value.toLowerCase();

  document.getElementById('tHead').innerHTML = `
    <tr>
      <th>客戶名稱</th>
      <th class="r">2026 (${curM}月)</th>
      <th class="r">2025 同期</th>
      <th class="r">2024 同期</th>
      <th class="r">YoY %</th>
    </tr>
  `;

  let list = CLIENT_NAMES.filter(c => c.toLowerCase().includes(kw));
  document.getElementById('tBody').innerHTML = list.map(c => {
    let v26 = D26[c]?.[idx] || D25[c][idx];
    let v25 = D25[c][idx];
    let v24 = D24[c][idx];
    let yoy = (((v26-v25)/v25)*100).toFixed(1);
    return `
      <tr>
        <td><b>${c}</b></td>
        <td class="r">NTD ${v26.toLocaleString()}</td>
        <td class="r">NTD ${v25.toLocaleString()}</td>
        <td class="r">NTD ${v24.toLocaleString()}</td>
        <td class="r"><span class="pill ${yoy>=0?'p-up':'p-dn'}">${yoy>=0?'+':''}${yoy}%</span></td>
      </tr>
    `;
  }).join('');
}

window.initApp = initApp;
window.onload = initApp;
</script>
